services:

  traefik:
    container_name: traefik
    image: traefik:v3.5.3
    restart: always
    command:
      - "--api.insecure=true"
      - "--entryPoints.http.address=:80"
      - "--entryPoints.https.address=:443"
      - "--log.level=ERROR"
      - "--log.filePath=/logs/traefik.log"
      - "--providers.docker"
      - "--providers.file.directory=/certs"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/:/logs/
      - ./certs/:/certs/
    networks:
      - default

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:v1.0.1
    logging:
      driver: none
    ports:
      - "1025:1025" # smtp server
      - "8025:8025" # web ui
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.test`)"
      - "traefik.http.routers.mailhog.tls=true"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  mysql:
    container_name: mysql
    image: mysql:8.4.7
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
    volumes:
      - ./mysql:/var/lib/mysql
    expose:
      - "3306"
    labels:
      - "traefik.tcp.routers.mysql.rule=HostSNI(`mysql.test`)"
      - "traefik.tcp.routers.mysql.tls=true"

  whoami:
    container_name: whoami
    image: traefik/whoami:latest
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.test`)"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"

  adminer:
    container_name: adminer
    image: adminer:5.4.1
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.test`)"
      - "traefik.http.routers.adminer.tls=true"

networks:
  default:
    name: local-dev
